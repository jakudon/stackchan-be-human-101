name: Validate face reference

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  static-face-check:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Check published face API and 22 LCD modes
        run: python tests/check_face_source.py
